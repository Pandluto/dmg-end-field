# Include inside the domestic site's `server {}` block, before the SPA fallback.
location = /api/mobile-shares/health {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/mobile-shares {
    # Desktop tactical shares contain a deduplicated portable SQLite worktree.
    # Keep this slightly above the Node service's 8 MiB JSON limit so the
    # service can return its structured PAYLOAD_TOO_LARGE response.
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
