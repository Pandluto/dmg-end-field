name: Web release draft

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic quality gate
        run: npm run check

  package:
    name: Package static Web application
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build self-contained Web package
        run: npm run build:local

      - name: Archive static files
        run: tar -czf "dmg-end-field-web-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Upload Web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dmg-end-field-web
          path: dmg-end-field-web-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create human-reviewed release draft
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Create checksum and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          if (( ${#files[@]} != 1 )); then
            echo "Expected one Web archive, found ${#files[@]}." >&2
            exit 1
          fi
          archive="${files[0]}"
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")") > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$(gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" --jq .draft)" != 'true' ]]; then
              echo 'Refusing to replace assets on a published release.' >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$archive" SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" SHA256SUMS \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "终末地伤害工作台 Web LTS $GITHUB_REF_NAME"
          fi
