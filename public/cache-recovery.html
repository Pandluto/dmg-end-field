<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DMG · 缓存恢复</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #090b0e;
        color: #f4f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 15%, rgba(207, 255, 52, 0.12), transparent 35%),
          linear-gradient(145deg, #0d1014, #060709 70%);
      }

      main {
        width: min(560px, 100%);
        padding: 36px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        background: rgba(18, 21, 26, 0.94);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #cfff34;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.1;
      }

      .description {
        margin: 18px 0 28px;
        color: #adb3bd;
        font-size: 15px;
        line-height: 1.75;
      }

      .status {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        min-height: 68px;
        padding: 16px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.055);
        color: #e7e9ed;
        line-height: 1.6;
      }

      .indicator {
        width: 10px;
        height: 10px;
        flex: 0 0 auto;
        margin-top: 7px;
        border-radius: 999px;
        background: #cfff34;
        box-shadow: 0 0 18px rgba(207, 255, 52, 0.6);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .status[data-state="done"] .indicator {
        animation: none;
      }

      .status[data-state="error"] .indicator {
        background: #ff6f61;
        box-shadow: 0 0 18px rgba(255, 111, 97, 0.5);
        animation: none;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      button,
      a {
        appearance: none;
        min-height: 42px;
        padding: 0 17px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        background: #cfff34;
        color: #101306;
        font: inherit;
        font-weight: 700;
        line-height: 40px;
        text-decoration: none;
        cursor: pointer;
      }

      button[hidden],
      a[hidden] {
        display: none;
      }

      .safety {
        margin: 18px 0 0;
        color: #757d89;
        font-size: 12px;
        line-height: 1.6;
      }

      @keyframes pulse {
        50% {
          opacity: 0.35;
          transform: scale(0.72);
        }
      }

      @media (max-width: 520px) {
        main {
          padding: 26px 22px;
          border-radius: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">RECOVERY ROUTE · NETWORK ONLY</p>
      <h1>正在清理页面缓存</h1>
      <p class="description">
        这个入口独立于主应用版本，只清理可能卡住页面的 Service Worker 和应用缓存。
      </p>
      <div class="status" id="status" role="status" aria-live="polite" data-state="working">
        <span class="indicator" aria-hidden="true"></span>
        <span id="statusText">正在注销 Service Worker…</span>
      </div>
      <div class="actions">
        <button id="retryButton" type="button" hidden>重新清理</button>
        <a id="returnLink" href="/" hidden>立即返回工作区</a>
      </div>
      <p class="safety">不会删除 SQLite、IndexedDB、localStorage，也不会改动你的工作区和本地存档。</p>
    </main>

    <script>
      (() => {
        'use strict';

        const appCachePrefixes = [
          'dmg-',
          'workbox-precache',
        ];
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const retryButton = document.getElementById('retryButton');
        const returnLink = document.getElementById('returnLink');
        let redirectTimer;

        function createReturnUrl() {
          const url = new URL('/', window.location.origin);
          url.searchParams.set('cache-recovery', Date.now().toString());
          return url;
        }

        function setStatus(state, message) {
          status.dataset.state = state;
          statusText.textContent = message;
        }

        function isAppCache(name) {
          return appCachePrefixes.some((prefix) => name.startsWith(prefix));
        }

        async function unregisterWorkers() {
          if (!('serviceWorker' in navigator)) return 0;
          const registrations = await navigator.serviceWorker.getRegistrations();
          const results = await Promise.allSettled(
            registrations.map((registration) => registration.unregister()),
          );
          const rejected = results.find((result) => result.status === 'rejected');
          if (rejected) throw rejected.reason;
          return results.filter((result) => result.status === 'fulfilled' && result.value).length;
        }

        async function deleteAppCaches() {
          if (!('caches' in window)) return 0;
          const cacheNames = await caches.keys();
          const appCacheNames = cacheNames.filter(isAppCache);
          const results = await Promise.allSettled(
            appCacheNames.map((name) => caches.delete(name)),
          );
          const rejected = results.find((result) => result.status === 'rejected');
          if (rejected) throw rejected.reason;
          return results.filter((result) => result.status === 'fulfilled' && result.value).length;
        }

        async function recover() {
          window.clearTimeout(redirectTimer);
          retryButton.hidden = true;
          returnLink.hidden = true;
          setStatus('working', '正在注销 Service Worker…');

          try {
            const workerCount = await unregisterWorkers();
            setStatus('working', '正在删除旧页面与资料缓存…');
            const cacheCount = await deleteAppCaches();
            const returnUrl = createReturnUrl();

            returnLink.href = returnUrl.href;
            returnLink.hidden = false;
            setStatus(
              'done',
              `清理完成：已注销 ${workerCount} 个 Service Worker，删除 ${cacheCount} 个应用缓存。即将返回工作区…`,
            );
            redirectTimer = window.setTimeout(() => {
              window.location.replace(returnUrl.href);
            }, 2200);
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            setStatus('error', `清理没有完成：${message}`);
            retryButton.hidden = false;
          }
        }

        retryButton.addEventListener('click', recover);
        window.addEventListener('pageshow', (event) => {
          if (event.persisted) recover();
        });
        recover();
      })();
    </script>
  </body>
</html>
